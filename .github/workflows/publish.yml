name: Publish to npm

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2

      - name: Setup Node.js (npm OIDC)
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Resolve version
        id: version
        run: |
          PKG_VERSION="$(bun -e "const p = JSON.parse(await Bun.file('package.json').text()); console.log(p.version)")"
          echo "tag_name=v${PKG_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Skip if tag exists
        id: check
        env:
          TAG_NAME: ${{ steps.version.outputs.tag_name }}
        run: |
          if git ls-remote --tags --exit-code origin "refs/tags/${TAG_NAME}" >/dev/null 2>&1; then
            echo "Tag ${TAG_NAME} already exists. Skipping."
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.check.outputs.should_publish == 'true'
        run: bun install --frozen-lockfile

      - name: Build
        if: steps.check.outputs.should_publish == 'true'
        run: bun run build

      - name: Publish
        if: steps.check.outputs.should_publish == 'true'
        run: npm publish --provenance
        env:
          NODE_AUTH_TOKEN: ''

      - name: Create git tag & release
        if: steps.check.outputs.should_publish == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.version.outputs.tag_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "${TAG_NAME}"
          git push origin "${TAG_NAME}"
          gh release create "${TAG_NAME}" --generate-notes
